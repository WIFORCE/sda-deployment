services:

  # Initialise the database, replaces: docker-compose run --rm -e CMD="migrate" app
  rems-migrate:
    extends:
      file: ./docker-compose.yml
      service: app
    depends_on:
      db:
        condition: service_started
    environment:
      - CMD=migrate
    ports: []
    restart: "no"
    #volumes:
    #  - ../rems/postgresql/data:/var/lib/postgresql/data

  db:
    volumes:
      - ../rems/postgresql/data:/var/lib/postgresql

  app:
    depends_on:
      rems-migrate:
        condition: service_completed_successfully
      mock-aai:
        condition: service_healthy
    ports: !override
      - "3000:3000"
    volumes:
      - ../configuration/rems/config.edn:/rems/config/config.edn
      - ../configuration/rems/keys:/rems/keys:ro
