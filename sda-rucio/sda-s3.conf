server {
    listen 443 ssl;
    server_name sda-s3;
    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;
    location / {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://s3:9000;
        proxy_set_header Host $host;
    }
}
